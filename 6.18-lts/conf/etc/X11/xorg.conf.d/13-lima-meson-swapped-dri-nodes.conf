Section "ServerFlags"
        Option          "AutoAddGPU" "off"
        Option          "Debug" "dmabuf_capable"
EndSection

Section "OutputClass"
	Identifier	"lima"
	MatchDriver	"meson"
	Driver		"modesetting"
	Option		"PrimaryGPU" "true"
EndSection

Section "OutputClass"
        Identifier      "kmsdev"
        MatchDriver     "modesetting"
	Option		"kmsdev" "/dev/dri/by-path/platform-d0100000.vpu-card"
EndSection

Section "OutputClass"
        Identifier      "accel"
        MatchDriver     "modesetting"
        Option          "AccelMethod" "glamor"
EndSection
